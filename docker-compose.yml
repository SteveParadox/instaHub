services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: instahub
      POSTGRES_USER: instahub
      POSTGRES_PASSWORD: instahub
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instahub -d instahub"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://instahub:instahub@db:5432/instahub
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://instahub:instahub@db:5432/instahub
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.tasks.celery worker --loglevel=INFO
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  beat:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://instahub:instahub@db:5432/instahub
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.tasks.celery beat --loglevel=INFO
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  postgres_data:
