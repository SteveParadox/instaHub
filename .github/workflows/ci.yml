name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install './apps/api[dev]'
      - run: python -m compileall apps/api/app
      - run: ruff check apps/api/app apps/api/migrations apps/api/tests
      - run: pytest apps/api/tests
      - run: DATABASE_URL=sqlite+pysqlite:///:memory: alembic -c apps/api/alembic.ini upgrade head
