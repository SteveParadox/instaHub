[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"

[project]
name="instahub-api"
version="0.5.0"
requires-python=">=3.12"
dependencies=["alembic>=1.14,<2","anyio>=4.6,<4.10","boto3>=1.35,<2","celery[redis]>=5.4,<6","cryptography>=43,<46","fastapi==0.115.6","httpx>=0.27,<0.28","itsdangerous>=2.2,<3","openai>=1.66,<2","pillow>=10.4,<12","psycopg[binary]>=3.2,<4","pydantic-settings>=2.6,<3","python-jose[cryptography]>=3.3,<4","sqlalchemy>=2.0,<3","uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev=["pytest>=8.3,<9","ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths=["tests"]

[tool.ruff]
line-length=140

[tool.ruff.lint]
ignore=["B008","BLE001"]

[tool.setuptools.packages.find]
include=["app*"]
exclude=["migrations*","tests*"]
